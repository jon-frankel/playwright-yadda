name: Set up the repository
description: Install pnpm and Node, then the root dependencies from the lockfile.

inputs:
  node-version:
    description: Node version. The Actual example needs 22.18 or newer.
    default: "24"
  cache-dependency-path:
    description: Lockfiles that key the pnpm store cache, one per line.
    default: pnpm-lock.yaml

outputs:
  node-version:
    description: The Node version that was installed, for keying caches of things Node built.
    value: ${{ steps.node.outputs.node-version }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 12
    - id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
