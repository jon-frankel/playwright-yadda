name: Example tests

# Reusable. Typechecks one project under examples/ and runs its Playwright suite.
#
# The examples depend on playwright-yadda from a local registry (their .npmrc points at Verdaccio), which
# CI doesn't have. So the library is built and packed from this commit and installed into the example in
# its place. That also makes the example test the library change it is checked with.
on:
  workflow_call:
    inputs:
      example:
        description: Directory name under examples/, for example basic.
        type: string
        required: true
      browsers:
        description: Playwright browsers to install, space separated. Empty installs none.
        type: string
        default: ""
      cache-path:
        description: A directory the example fills on first run, to restore between runs.
        type: string
        default: ""
      cache-key-file:
        description: A file whose content keys that cache. Required with cache-path.
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 15

permissions:
  contents: read

jobs:
  test:
    name: examples/${{ inputs.example }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: examples/${{ inputs.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/${{ inputs.example }}/pnpm-lock.yaml

      - name: Build and pack the library
        working-directory: .
        run: |
          pnpm run build
          pnpm pack --pack-destination "$RUNNER_TEMP/pack"

      - name: Install the example against the packed library
        run: |
          tarball=$(ls "$RUNNER_TEMP"/pack/playwright-yadda-*.tgz)
          pnpm add --registry https://registry.npmjs.org/ "playwright-yadda@file:$tarball"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Install Playwright browsers
        if: inputs.browsers != ''
        env:
          BROWSERS: ${{ inputs.browsers }}
        run: |
          read -ra browsers <<< "$BROWSERS"
          pnpm exec playwright install --with-deps "${browsers[@]}"

      - name: Restore the example's cache
        if: inputs.cache-path != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/${{ inputs.example }}/${{ inputs.cache-path }}
          key: example-${{ inputs.example }}-${{ hashFiles(format('examples/{0}/{1}', inputs.example, inputs.cache-key-file)) }}

      - name: Test
        run: pnpm run test

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-${{ inputs.example }}-test-results
          path: examples/${{ inputs.example }}/test-results
          if-no-files-found: ignore
          retention-days: 7
