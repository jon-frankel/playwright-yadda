name: Example tests

# Reusable. Typechecks one project under examples/ and runs its Playwright suite.
#
# The examples depend on playwright-yadda from a tarball (file:../../.pack/playwright-yadda.tgz).
# scripts/examples-install.mjs builds and packs the library from this commit and installs it into the
# example, so the example tests the library change it is checked with. It is the same command used locally.
on:
  workflow_call:
    inputs:
      example:
        description: Directory name under examples/, for example basic.
        type: string
        required: true
      browsers:
        description: Playwright browsers to install, space separated. Empty installs none.
        type: string
        default: ""
      cache-path:
        description: A directory the example fills on first run, to restore between runs.
        type: string
        default: ""
      cache-key-file:
        description: A file whose content keys that cache. Required with cache-path.
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 15

permissions:
  contents: read

jobs:
  test:
    name: examples/${{ inputs.example }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: examples/${{ inputs.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./.github/actions/setup
        with:
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/${{ inputs.example }}/pnpm-lock.yaml

      - name: Build the library and install it into the example
        working-directory: .
        run: node scripts/examples-install.mjs "${{ inputs.example }}"

      - name: Typecheck
        run: pnpm run typecheck

      - name: Install Playwright browsers
        if: inputs.browsers != ''
        env:
          BROWSERS: ${{ inputs.browsers }}
        run: |
          read -ra browsers <<< "$BROWSERS"
          pnpm exec playwright install --with-deps "${browsers[@]}"

      - name: Restore the example's cache
        if: inputs.cache-path != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/${{ inputs.example }}/${{ inputs.cache-path }}
          key: example-${{ inputs.example }}-${{ runner.os }}-node${{ steps.setup.outputs.node-version }}-${{ hashFiles(format('examples/{0}/{1}', inputs.example, inputs.cache-key-file)) }}

      - name: Test
        run: pnpm run test --trace=retain-on-failure

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: example-${{ inputs.example }}-test-results
          path: examples/${{ inputs.example }}/test-results
          if-no-files-found: ignore
          retention-days: 7
