name: JetBrains plugin tests

# Reusable. The headless platform tests of ide/jetbrains (Gradle, JDK 25, a WebStorm test sandbox that
# Gradle downloads on first use, about 1 GB, and caches).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ide/jetbrains
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test and Verify Plugin
        run: ./gradlew test verifyPlugin --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jetbrains-plugin-test-reports
          path: |
            ide/jetbrains/build/reports/tests
            ide/jetbrains/build/reports/pluginVerifier
            ide/jetbrains/build/test-results
          if-no-files-found: ignore
          retention-days: 7
