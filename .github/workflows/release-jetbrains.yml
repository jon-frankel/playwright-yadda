name: Release JetBrains Plugin

# Manually triggered workflow to verify, sign, and publish the JetBrains IDE plugin
# (ide/jetbrains) to the JetBrains Marketplace and GitHub Releases.
#
# Release Process:
# 1. verify job (contents: read, no write/publishing secrets):
#    - Verifies trigger is on main.
#    - Determines candidate version from ide/jetbrains/gradle.properties (or applies requested bump).
#    - Checks that git tag jetbrains-v<version> and Marketplace version do not already exist.
#    - Generates HTML change notes (for Marketplace) and Markdown release notes (for GitHub Release).
#    - Executes headless platform tests (./gradlew test), JetBrains Plugin Verifier (./gradlew verifyPlugin),
#      and builds the plugin distribution (./gradlew buildPlugin).
#    - Generates a git patch if gradle.properties was bumped and uploads verified artifacts.
# 2. publish job (environment: jetbrains-release, contents: write, id-token: write, attestations: write):
#    - Applies release.patch (if version was bumped), creates annotated tag jetbrains-v<version>,
#      and pushes atomically to origin BEFORE publishing.
#    - Cryptographically signs the plugin (./gradlew signPlugin) and publishes to JetBrains Marketplace
#      (./gradlew publishPlugin).
#    - Attests SLSA build provenance for the signed distribution archive.
#    - Creates a GitHub Release for jetbrains-v<version> with the signed plugin .zip attached.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (auto uses gradle.properties version if untagged, else bumps patch)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      channel:
        description: "JetBrains Marketplace release channel"
        required: true
        default: "default"
        type: choice
        options:
          - default
          - eap
          - alpha
      dry_run:
        description: "Dry run (runs tests, verifyPlugin, and builds .zip without pushing tags or publishing)"
        required: false
        default: false
        type: boolean

concurrency:
  group: jetbrains-release-pipeline
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Verification & Pre-Flight Testing (Read-only permissions)
  # -------------------------------------------------------------------------
  verify:
    name: Verify & Build JetBrains Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bump_step.outputs.version }}
      previous_tag: ${{ steps.bump_step.outputs.previous_tag }}
      bumped: ${{ steps.bump_step.outputs.bumped }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Determine Candidate Version & Generate Change Notes
        id: bump_step
        run: |
          mkdir -p dist-jetbrains

          PREV_TAG=$(git tag --list 'jetbrains-v*' --sort=-v:refname | head -n 1 || true)
          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.error
          import urllib.request
          import html

          requested = "${{ inputs.bump }}"
          prev_tag = "${{ steps.bump_step.outputs.previous_tag }}" if False else os.popen("git tag --list 'jetbrains-v*' --sort=-v:refname | head -n 1").read().strip()
          props_path = "ide/jetbrains/gradle.properties"

          with open(props_path, "r", encoding="utf-8") as f:
              props = f.read()

          m = re.search(r"^pluginVersion=(\d+)\.(\d+)\.(\d+)\s*$", props, re.MULTILINE)
          if not m:
              print("::error::Could not parse pluginVersion=X.Y.Z in ide/jetbrains/gradle.properties", file=sys.stderr)
              sys.exit(1)

          maj, min_v, patch = map(int, m.groups())
          current_version = f"{maj}.{min_v}.{patch}"

          def tag_exists(ver: str) -> bool:
              res = subprocess.run(
                  ["git", "rev-parse", "-q", "--verify", f"refs/tags/jetbrains-v{ver}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              return res.returncode == 0

          bump_kind = requested
          if requested == "auto":
              if tag_exists(current_version):
                  print(f"Tag jetbrains-v{current_version} already exists; bumping patch version.")
                  bump_kind = "patch"
              else:
                  bump_kind = "none"

          if bump_kind == "major":
              maj, min_v, patch = maj + 1, 0, 0
          elif bump_kind == "minor":
              min_v, patch = min_v + 1, 0
          elif bump_kind == "patch":
              patch += 1

          new_version = f"{maj}.{min_v}.{patch}"
          bumped = new_version != current_version

          if bumped:
              updated_props = re.sub(
                  r"^pluginVersion=\d+\.\d+\.\d+\s*$",
                  f"pluginVersion={new_version}",
                  props,
                  count=1,
                  flags=re.MULTILINE,
              )
              with open(props_path, "w", encoding="utf-8") as f:
                  f.write(updated_props)

          if tag_exists(new_version):
              print(f"::error::Git tag jetbrains-v{new_version} already exists.", file=sys.stderr)
              sys.exit(1)

          # Check JetBrains Marketplace API to ensure version is not already published
          plugin_xml_id = "io.github.jonfrankel.playwright-yadda"
          url = f"https://plugins.jetbrains.com/api/plugins/{plugin_xml_id}/updates?size=50"
          try:
              req = urllib.request.Request(url, headers={"Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  updates = json.loads(resp.read().decode("utf-8"))
                  if isinstance(updates, list):
                      for u in updates:
                          if u.get("version") == new_version:
                              print(f"::error::Version {new_version} of {plugin_xml_id} is already published on JetBrains Marketplace.", file=sys.stderr)
                              sys.exit(1)
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  print(f"Plugin {plugin_xml_id} not yet listed on Marketplace (HTTP 404); skipping remote duplicate check.")
              else:
                  print(f"::warning::Marketplace version check returned HTTP {e.code}; continuing.")
          except Exception as e:
              print(f"::warning::Could not reach JetBrains Marketplace API ({e}); continuing.")

          # Collect commit messages touching ide/jetbrains since previous jetbrains-v* tag
          log_range = f"{prev_tag}..HEAD" if prev_tag else "-n 30"
          log_cmd = ["git", "log", "--no-merges", "--pretty=format:%s (%h)"]
          if prev_tag:
              log_cmd.append(log_range)
          else:
              log_cmd.extend(["-n", "30"])
          log_cmd.extend(["--", "ide/jetbrains"])

          raw_lines = subprocess.check_output(log_cmd, text=True).strip().splitlines()
          items = [line.strip() for line in raw_lines if line.strip() and not line.startswith("release(ide):")]
          if not items:
              items = [f"Release Playwright Yadda JetBrains plugin v{new_version}."]

          html_items = "\n".join(f"  <li>{html.escape(item)}</li>" for item in items)
          change_notes_html = f"<ul>\n{html_items}\n</ul>\n"
          with open("dist-jetbrains/change-notes.html", "w", encoding="utf-8") as f:
              f.write(change_notes_html)

          md_items = "\n".join(f"- {item}" for item in items)
          release_notes_md = (
              f"## Playwright Yadda for JetBrains IDEs v{new_version}\n\n"
              f"### Changes\n\n{md_items}\n\n"
              f"### Installation\n\n"
              f"- **JetBrains Marketplace**: In WebStorm or another JetBrains IDE (2026.2+), open **Settings → Plugins → Marketplace** and search for **Playwright Yadda**.\n"
              f"- **From Disk**: Download `playwright-yadda-jetbrains-{new_version}-signed.zip` below and choose **Settings → Plugins → ⚙ → Install Plugin from Disk…**.\n"
          )
          with open("dist-jetbrains/release-notes.md", "w", encoding="utf-8") as f:
              f.write(release_notes_md)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={new_version}\n")
              out.write(f"bumped={'true' if bumped else 'false'}\n")

          print(f"Candidate JetBrains plugin version: {new_version} (bumped={bumped})")
          PY

      - name: Run Tests, Plugin Verifier & Build Distribution
        working-directory: ide/jetbrains
        run: |
          export PLUGIN_CHANGE_NOTES="$(cat ../dist-jetbrains/change-notes.html)"
          ./gradlew test verifyPlugin buildPlugin --console=plain

      - name: Upload Test & Verifier Reports on Failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jetbrains-release-failure-reports
          path: |
            ide/jetbrains/build/reports/tests
            ide/jetbrains/build/reports/pluginVerifier
            ide/jetbrains/build/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stage Verified Plugin Distribution & Patch
        run: |
          VERSION="${{ steps.bump_step.outputs.version }}"
          cp "ide/jetbrains/build/distributions/playwright-yadda-jetbrains-${VERSION}.zip" dist-jetbrains/

          if [ "${{ steps.bump_step.outputs.bumped }}" = "true" ]; then
            git diff --binary ide/jetbrains/gradle.properties > dist-jetbrains/release.patch
            if [ ! -s dist-jetbrains/release.patch ]; then
              echo "::error::Expected non-empty release.patch after version bump."
              exit 1
            fi
          fi

      - name: Upload Verified JetBrains Release Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jetbrains-release-artifacts
          path: dist-jetbrains/
          retention-days: 1

  # -------------------------------------------------------------------------
  # Job 2: Sign, Publish to Marketplace & Create GitHub Release
  # -------------------------------------------------------------------------
  publish:
    name: Sign & Publish to Marketplace & GitHub Release
    needs: verify
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: jetbrains-release
      url: https://plugins.jetbrains.com/plugin/io.github.jonfrankel.playwright-yadda
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Download Verified Release Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jetbrains-release-artifacts
          path: dist-jetbrains/

      - name: Apply Release Patch (if bumped), Tag & Push Atomically
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          TAG="jetbrains-v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f dist-jetbrains/release.patch ] && [ -s dist-jetbrains/release.patch ]; then
            git apply --index dist-jetbrains/release.patch
            git commit -m "release(ide): jetbrains plugin v$VERSION [skip ci]"
            git tag -a "$TAG" -m "JetBrains Plugin v$VERSION"
            git push --atomic origin HEAD:main "$TAG"
          else
            git tag -a "$TAG" -m "JetBrains Plugin v$VERSION"
            git push origin "$TAG"
          fi

      - name: Sign & Publish Plugin to JetBrains Marketplace
        working-directory: ide/jetbrains
        env:
          CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
        run: |
          if [ -z "$CERTIFICATE_CHAIN" ] || [ -z "$PRIVATE_KEY" ] || [ -z "$PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets (JETBRAINS_CERTIFICATE_CHAIN, JETBRAINS_PRIVATE_KEY, JETBRAINS_PRIVATE_KEY_PASSWORD) in jetbrains-release environment."
            exit 1
          fi
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::Missing JETBRAINS_PUBLISH_TOKEN secret in jetbrains-release environment."
            exit 1
          fi

          export PLUGIN_CHANGE_NOTES="$(cat ../dist-jetbrains/change-notes.html)"
          mkdir -p build/distributions
          cp "../dist-jetbrains/playwright-yadda-jetbrains-${{ needs.verify.outputs.version }}.zip" build/distributions/
          ./gradlew signPlugin publishPlugin \
            -PprebuiltPluginArchive="build/distributions/playwright-yadda-jetbrains-${{ needs.verify.outputs.version }}.zip" \
            -PpluginChannel="${{ inputs.channel }}" \
            --console=plain

      - name: Attest Build Provenance (SLSA)
        uses: actions/attest-build-provenance@c074443f1a5fb4aee83904b712414300e19063ef # v2.2.3
        with:
          subject-path: "ide/jetbrains/build/distributions/playwright-yadda-jetbrains-*-signed.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          TAG="jetbrains-v$VERSION"

          gh release create "$TAG" \
            "ide/jetbrains/build/distributions/playwright-yadda-jetbrains-${VERSION}-signed.zip" \
            "dist-jetbrains/playwright-yadda-jetbrains-${VERSION}.zip" \
            --title "JetBrains Plugin v$VERSION" \
            --notes-file dist-jetbrains/release-notes.md
