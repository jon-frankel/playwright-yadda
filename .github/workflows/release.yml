name: Release Package

# Manually triggered workflow to publish playwright-yadda to the public npm registry.
#
# Release Process:
# 1. Determines candidate version (consumes changesets or applies semver bump).
# 2. Boots Verdaccio in CI and publishes candidate package locally.
# 3. Upgrades all example projects to candidate version from Verdaccio.
# 4. Executes full validation suite (unit tests, static analysis, all example tests, IDE plugin).
# 5. Generates CycloneDX and SPDX SBOMs and GitHub SLSA build provenance attestations.
# 6. Publishes to https://registry.npmjs.org/ with --provenance using OIDC Trusted Publishing.
# 7. Commits version bumps to main, tags vX.Y.Z, and creates GitHub Release with commit notes.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  release:
    name: Build, Verify & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: npm-release
      url: https://www.npmjs.com/package/playwright-yadda
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node and pnpm
        id: setup
        uses: ./.github/actions/setup
        with:
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/basic/pnpm-lock.yaml
            examples/wordpress/pnpm-lock.yaml
            examples/actual/pnpm-lock.yaml

      - name: Setup Java for JetBrains platform tests
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Restore Actual Dev Server Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/actual/.cache
          key: example-actual-${{ runner.os }}-node${{ steps.setup.outputs.node-version }}-${{ hashFiles('examples/actual/scripts/serve.mjs') }}

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Determine New Version & Update package.json
        id: bump_step
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

          OLD_VERSION=$(node -p "require('./package.json').version")

          if [ "${{ inputs.bump }}" = "auto" ]; then
            pnpm exec changeset version
            NEW_VERSION=$(node -p "require('./package.json').version")
            if [ "$NEW_VERSION" = "$OLD_VERSION" ]; then
              echo "No pending changesets found; defaulting to patch bump."
              npm version patch --no-git-tag-version
              NEW_VERSION=$(node -p "require('./package.json').version")
            fi
          else
            pnpm exec changeset version --empty 2>/dev/null || true
            npm version ${{ inputs.bump }} --no-git-tag-version
            NEW_VERSION=$(node -p "require('./package.json').version")
          fi

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Candidate version to release: $NEW_VERSION"

      - name: Start Verdaccio Registry Container
        run: |
          pnpm run verdaccio:start
          until curl -s http://localhost:4873/ > /dev/null; do
            sleep 1
          done
          TOKEN=$(node scripts/npm-authn/index.mjs create-token playwright-yadda password http://localhost:4873)
          echo "NPM_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Publish Candidate to Verdaccio & Update Example Workspaces
        run: |
          node scripts/verdaccio-sync.mjs --no-bump

      - name: Run Root Checks & Unit Tests
        run: |
          pnpm run check

      - name: Run Example Tests (against Verdaccio package)
        run: |
          echo "Running examples/basic tests..."
          pnpm --dir examples/basic test --trace=retain-on-failure

          echo "Running examples/wordpress tests..."
          pnpm --dir examples/wordpress test --trace=retain-on-failure

          echo "Running examples/actual tests..."
          pnpm --dir examples/actual test --trace=retain-on-failure

      - name: Run JetBrains Plugin Tests
        run: |
          cd ide/jetbrains && ./gradlew test --console=plain

      - name: Run Security Audit (Production Dependencies)
        run: |
          pnpm audit --prod --audit-level=high

      - name: Stop Verdaccio Container
        if: always()
        run: |
          pnpm run verdaccio:stop || true

      - name: Pack Production Tarball & Generate SBOMs
        run: |
          mkdir -p dist-pack
          pnpm pack --pack-destination dist-pack
          npm sbom --sbom-format=cyclonedx --omit=dev > dist-pack/sbom.cyclonedx.json
          npm sbom --sbom-format=spdx --omit=dev > dist-pack/sbom.spdx.json

      - name: Attest Build Provenance (SLSA)
        uses: actions/attest-build-provenance@c074443f1a5fb4aee83904b712414300e19063ef # v2.2.3
        with:
          subject-path: "dist-pack/playwright-yadda-*.tgz"

      - name: Attest SBOM
        uses: actions/attest-sbom@df501e29bc01a65642d3fb09dc8c88d6a9a7795b # v2.2.2
        with:
          subject-path: "dist-pack/playwright-yadda-*.tgz"
          sbom-path: "dist-pack/sbom.cyclonedx.json"

      - name: Publish to npm Registry with Provenance (OIDC)
        run: |
          TARBALL=$(ls dist-pack/playwright-yadda-*.tgz)
          echo "Publishing $TARBALL to registry.npmjs.org with provenance via OIDC..."
          npm publish "$TARBALL" --access public --provenance --registry https://registry.npmjs.org/

      - name: Commit Release Updates to Main
        run: |
          VERSION="${{ steps.bump_step.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md examples/ .changeset/ || true
          git commit -m "release: v$VERSION [skip ci]" || echo "Nothing to commit"
          git push origin HEAD:main

      - name: Create Git Tag & Push
        run: |
          VERSION="${{ steps.bump_step.outputs.version }}"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.bump_step.outputs.version }}"
          PREV_TAG="${{ steps.bump_step.outputs.previous_tag }}"

          NOTES_FLAG="--generate-notes"
          if [ -n "$PREV_TAG" ]; then
            NOTES_FLAG="--generate-notes --notes-start-tag $PREV_TAG"
          fi

          gh release create "v$VERSION" \
            dist-pack/playwright-yadda-*.tgz \
            dist-pack/sbom.cyclonedx.json \
            dist-pack/sbom.spdx.json \
            --title "v$VERSION" \
            $NOTES_FLAG
