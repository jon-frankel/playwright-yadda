name: Release Package

# Manually triggered workflow to publish playwright-yadda to the public npm registry.
#
# Release Process:
# 1. verify job (contents: read, no OIDC write access):
#    - Verifies trigger is on main.
#    - Determines candidate version (consumes changesets or applies semver bump).
#    - Boots Verdaccio in CI and publishes candidate package locally.
#    - Upgrades all example projects to candidate version from Verdaccio.
#    - Executes full validation suite (unit tests, static analysis, all example tests, IDE plugin).
#    - Runs security audit on production dependencies.
#    - Downloads the exact verified tarball from Verdaccio for tarball parity.
#    - Generates CycloneDX and SPDX SBOMs via native pnpm sbom.
#    - Generates a git release patch capturing package.json, CHANGELOG.md, examples, and changeset deletions.
#    - Uploads artifacts.
# 2. publish job (contents: write, id-token: write, attestations: write):
#    - Applies the release patch and commits to main.
#    - Pushes commit and tag atomically BEFORE publishing.
#    - Attests SLSA build provenance and SBOM.
#    - Publishes the exact verified tarball to https://registry.npmjs.org/ with --provenance using OIDC.
#    - Creates GitHub Release with commit notes and attached SBOMs & tarball.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (runs verification without pushing to main or publishing to npm)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Verification & Pre-Flight Testing (Read-only permissions)
  # -------------------------------------------------------------------------
  verify:
    name: Verify & Build Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.bump_step.outputs.version }}
      previous_tag: ${{ steps.bump_step.outputs.previous_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tip of main passed Validate Main workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TIP_SHA="${{ github.sha }}"
          echo "Verifying 'Validate Main' workflow for commit: $TIP_SHA"

          RUN_DATA=$(gh run list \
            --workflow validate-main.yml \
            --commit "$TIP_SHA" \
            --json databaseId,status,conclusion,url \
            --jq '.[0] // empty')

          if [ -z "$RUN_DATA" ]; then
            echo "::error::No 'Validate Main' workflow run found for commit $TIP_SHA."
            exit 1
          fi

          RUN_ID=$(echo "$RUN_DATA" | jq -r '.databaseId')
          STATUS=$(echo "$RUN_DATA" | jq -r '.status')
          CONCLUSION=$(echo "$RUN_DATA" | jq -r '.conclusion // empty')
          RUN_URL=$(echo "$RUN_DATA" | jq -r '.url')

          echo "Found Validate Main run $RUN_ID ($RUN_URL): status='$STATUS', conclusion='$CONCLUSION'"

          TIMEOUT=1800 # 30 minutes max wait if run is in progress
          while [ "$STATUS" != "completed" ]; do
            if [ "$TIMEOUT" -le 0 ]; then
              echo "::error::Timed out waiting for Validate Main ($RUN_URL) to complete."
              exit 1
            fi
            echo "Validate Main is currently '$STATUS'. Waiting 15s for completion... (timeout remaining: ${TIMEOUT}s)"
            sleep 15
            TIMEOUT=$((TIMEOUT - 15))
            RUN_DATA=$(gh run view "$RUN_ID" --json status,conclusion --jq '{status: .status, conclusion: (.conclusion // empty)}')
            STATUS=$(echo "$RUN_DATA" | jq -r '.status')
            CONCLUSION=$(echo "$RUN_DATA" | jq -r '.conclusion')
          done

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::The 'Validate Main' workflow ($RUN_URL) did not succeed (conclusion: '$CONCLUSION'). Cannot release."
            exit 1
          fi

          echo "Validate Main passed successfully for $TIP_SHA ($RUN_URL)."

      - name: Setup Node and pnpm
        id: setup
        uses: ./.github/actions/setup
        with:
          cache-dependency-path: pnpm-lock.yaml

      - name: Determine Candidate Version & Update package.json
        id: bump_step
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

          node scripts/bump-release-version.mjs "${{ inputs.bump }}"

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Candidate version to release: $NEW_VERSION"

          # Verify candidate version is not already published on registry.npmjs.org
          if npm view "playwright-yadda@$NEW_VERSION" version --registry https://registry.npmjs.org/ --silent >/dev/null 2>&1; then
            echo "::error::playwright-yadda@$NEW_VERSION is already published to registry.npmjs.org. Cannot republish an existing version."
            exit 1
          fi

      - name: Run Unit Tests Sanity Check & Build
        run: |
          pnpm vitest run src/
          pnpm run build

      - name: Run Security Audit (Production Dependencies)
        run: |
          pnpm audit --prod --audit-level=high

      - name: Pack Distribution Tarball & Generate SBOMs
        run: |
          mkdir -p dist-pack
          pnpm pack --pack-destination dist-pack
          pnpm sbom --sbom-format cyclonedx --prod > dist-pack/sbom.cyclonedx.json
          pnpm sbom --sbom-format spdx --prod > dist-pack/sbom.spdx.json

      - name: Dry-Run npm Publish (Tarball & Registry Validation)
        run: |
          TARBALL=$(ls "$PWD"/dist-pack/playwright-yadda-*.tgz)
          echo "Simulating npm publish with --dry-run for $TARBALL..."
          npm publish "$TARBALL" --access public --dry-run --registry https://registry.npmjs.org/

      - name: Generate Release Patch
        run: |
          git add -A -- package.json .changeset
          if [ -f CHANGELOG.md ]; then
            git add CHANGELOG.md
          fi
          git diff --cached --binary > dist-pack/release.patch
          if [ ! -s dist-pack/release.patch ]; then
            echo "Error: release.patch is empty - no changes staged."
            exit 1
          fi

      - name: Upload Verified Release Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: dist-pack/
          retention-days: 1

  # -------------------------------------------------------------------------
  # Job 2: Secure Publish & Release (Restricted environment, OIDC tokens)
  # -------------------------------------------------------------------------
  publish:
    name: Publish to npm & GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-release
      url: https://www.npmjs.com/package/playwright-yadda
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download Verified Release Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist-pack/

      - name: Apply Release Patch, Commit & Push Atomically
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          git apply --index dist-pack/release.patch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "release: v$VERSION [skip ci]"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "[Dry Run] Release patch applied and commit/tag created locally. Skipping git push to main."
          else
            # Push commit and tag atomically BEFORE publishing to npm
            git push --atomic origin HEAD:main "v$VERSION"
          fi

      - name: Attest Build Provenance (SLSA)
        if: inputs.dry_run != true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist-pack/playwright-yadda-*.tgz"

      - name: Attest SBOM
        if: inputs.dry_run != true
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: "dist-pack/playwright-yadda-*.tgz"
          sbom-path: "dist-pack/sbom.cyclonedx.json"

      - name: Publish to npm Registry with Provenance (OIDC)
        run: |
          TARBALL=$(ls "$PWD"/dist-pack/playwright-yadda-*.tgz)
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "[Dry Run] Testing npm publish with --provenance --dry-run (validates OIDC tokens without uploading)..."
            npm publish "$TARBALL" --access public --provenance --registry https://registry.npmjs.org/ --dry-run
          else
            echo "Publishing $TARBALL to registry.npmjs.org with provenance via OIDC..."
            npm publish "$TARBALL" --access public --provenance --registry https://registry.npmjs.org/
          fi

      - name: Create GitHub Release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          PREV_TAG="${{ needs.verify.outputs.previous_tag }}"

          NOTES_FLAG="--generate-notes"
          if [ -n "$PREV_TAG" ]; then
            NOTES_FLAG="--generate-notes --notes-start-tag $PREV_TAG"
          fi

          gh release create "v$VERSION" \
            dist-pack/playwright-yadda-*.tgz \
            dist-pack/sbom.cyclonedx.json \
            dist-pack/sbom.spdx.json \
            --title "v$VERSION" \
            $NOTES_FLAG

      - name: Preview GitHub Release (Dry Run)
        if: inputs.dry_run == true
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          echo "================================================================="
          echo "[Dry Run] Release simulation for v$VERSION completed successfully."
          echo "All artifacts, SBOMs, git patch, and npm provenance verified."
          echo "No changes pushed to git, npm registry, or GitHub Releases."
          echo "================================================================="
