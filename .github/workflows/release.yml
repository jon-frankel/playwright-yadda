name: Release Package

# Manually triggered workflow to publish playwright-yadda to the public npm registry.
#
# Release Process:
# 1. verify job (contents: read, no OIDC write access):
#    - Verifies trigger is on main.
#    - Determines candidate version (consumes changesets or applies semver bump).
#    - Boots Verdaccio in CI and publishes candidate package locally.
#    - Upgrades all example projects to candidate version from Verdaccio.
#    - Executes full validation suite (unit tests, static analysis, all example tests, IDE plugin).
#    - Runs security audit on production dependencies.
#    - Downloads the exact verified tarball from Verdaccio for tarball parity.
#    - Generates CycloneDX and SPDX SBOMs via native pnpm sbom.
#    - Generates a git release patch capturing package.json, CHANGELOG.md, examples, and changeset deletions.
#    - Uploads artifacts.
# 2. publish job (contents: write, id-token: write, attestations: write):
#    - Applies the release patch and commits to main.
#    - Pushes commit and tag atomically BEFORE publishing.
#    - Attests SLSA build provenance and SBOM.
#    - Publishes the exact verified tarball to https://registry.npmjs.org/ with --provenance using OIDC.
#    - Creates GitHub Release with commit notes and attached SBOMs & tarball.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (runs verification without pushing to main or publishing to npm)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Verification & Pre-Flight Testing (Read-only permissions)
  # -------------------------------------------------------------------------
  verify:
    name: Verify & Build Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bump_step.outputs.version }}
      previous_tag: ${{ steps.bump_step.outputs.previous_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        id: setup
        uses: ./.github/actions/setup
        with:
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/basic/pnpm-lock.yaml
            examples/wordpress/pnpm-lock.yaml
            examples/actual/pnpm-lock.yaml

      - name: Setup Java for JetBrains platform tests
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Restore Actual Dev Server Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: examples/actual/.cache
          key: example-actual-${{ runner.os }}-node${{ steps.setup.outputs.node-version }}-${{ hashFiles('examples/actual/scripts/serve.mjs') }}

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Determine Candidate Version & Update package.json
        id: bump_step
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"

          node -e '
            const fs = require("node:fs");
            const { execSync } = require("node:child_process");

            const requested = "${{ inputs.bump }}";
            const pkgBefore = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const oldVersion = pkgBefore.version;

            // Run changeset version to consume pending changesets and update CHANGELOG.md
            // Do not swallow errors: fail immediately if changeset version fails
            execSync("pnpm exec changeset version", { stdio: "inherit" });

            const pkgAfter = JSON.parse(fs.readFileSync("package.json", "utf8"));
            let currentVersion = pkgAfter.version;

            const [oldMaj, oldMin, oldPatch] = oldVersion.split(".").map(Number);
            const [newMaj, newMin, newPatch] = currentVersion.split(".").map(Number);

            let changesetBump = "none";
            if (newMaj > oldMaj) changesetBump = "major";
            else if (newMin > oldMin) changesetBump = "minor";
            else if (newPatch > oldPatch) changesetBump = "patch";

            const semverOrder = { patch: 1, minor: 2, major: 3 };

            if (requested === "auto") {
              if (changesetBump === "none") {
                console.log("No changesets consumed; bumping patch version.");
                execSync("npm version patch --no-git-tag-version", { stdio: "inherit" });
              }
            } else if ((semverOrder[requested] || 0) > (semverOrder[changesetBump] || 0)) {
              console.log(`Requested bump "${requested}" requires upgrading beyond changeset bump "${changesetBump}".`);
              // Reset version to oldVersion so npm version increments from baseline
              fs.writeFileSync("package.json", JSON.stringify({ ...pkgAfter, version: oldVersion }, null, 2) + "\n");
              execSync(`npm version ${requested} --no-git-tag-version`, { stdio: "inherit" });
            }

            const finalVersion = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            if (fs.existsSync("CHANGELOG.md") && changesetBump !== "none" && finalVersion !== currentVersion) {
              console.log(`Syncing CHANGELOG.md top heading to ${finalVersion}`);
              const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
              const updated = changelog.replace(/^##\s+\d+\.\d+\.\d+/m, `## ${finalVersion}`);
              fs.writeFileSync("CHANGELOG.md", updated, "utf8");
            }
          '

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Candidate version to release: $NEW_VERSION"

      - name: Start Verdaccio Registry Container
        run: |
          pnpm run verdaccio:start
          until curl -s http://localhost:4873/ > /dev/null; do
            sleep 1
          done
          TOKEN=$(node scripts/npm-authn/index.mjs create-token playwright-yadda password http://localhost:4873)
          echo "NPM_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Publish Candidate to Verdaccio & Update Example Workspaces
        run: |
          node scripts/verdaccio-sync.mjs --no-bump

      - name: Run Root Checks & Unit Tests
        run: |
          pnpm run check

      - name: Run Example Tests (against Verdaccio package)
        run: |
          echo "Running examples/basic tests..."
          pnpm --dir examples/basic test --trace=retain-on-failure

          echo "Running examples/wordpress tests..."
          pnpm --dir examples/wordpress test --trace=retain-on-failure

          echo "Running examples/actual tests..."
          pnpm --dir examples/actual test --trace=retain-on-failure

      - name: Run JetBrains Plugin Tests
        run: |
          cd ide/jetbrains && ./gradlew test --console=plain

      - name: Run Security Audit (Production Dependencies)
        run: |
          pnpm audit --prod --audit-level=high

      - name: Download Verified Tarball from Verdaccio & Generate SBOMs
        run: |
          VERSION="${{ steps.bump_step.outputs.version }}"
          mkdir -p dist-pack
          # Download the exact verified tarball from Verdaccio to preserve byte-for-byte lockfile integrity
          npm pack "playwright-yadda@$VERSION" --registry http://localhost:4873 --pack-destination dist-pack
          # Generate SBOMs via native pnpm sbom
          pnpm sbom --sbom-format cyclonedx --prod > dist-pack/sbom.cyclonedx.json
          pnpm sbom --sbom-format spdx --prod > dist-pack/sbom.spdx.json

      - name: Stop Verdaccio Container
        if: always()
        run: |
          pnpm run verdaccio:stop || true

      - name: Generate Release Patch
        run: |
          git add -A -- package.json examples .changeset
          if [ -f CHANGELOG.md ]; then
            git add CHANGELOG.md
          fi
          git diff --cached --binary > dist-pack/release.patch
          if [ ! -s dist-pack/release.patch ]; then
            echo "Error: release.patch is empty - no changes staged."
            exit 1
          fi

      - name: Upload Verified Release Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: dist-pack/
          retention-days: 1

  # -------------------------------------------------------------------------
  # Job 2: Secure Publish & Release (Restricted environment, OIDC tokens)
  # -------------------------------------------------------------------------
  publish:
    name: Publish to npm & GitHub Release
    needs: verify
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-release
      url: https://www.npmjs.com/package/playwright-yadda
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download Verified Release Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: dist-pack/

      - name: Apply Release Patch, Commit & Push Atomically
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          git apply --index dist-pack/release.patch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "release: v$VERSION [skip ci]"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          # Push commit and tag atomically BEFORE publishing to npm
          git push --atomic origin HEAD:main "v$VERSION"

      - name: Attest Build Provenance (SLSA)
        uses: actions/attest-build-provenance@c074443f1a5fb4aee83904b712414300e19063ef # v2.2.3
        with:
          subject-path: "dist-pack/playwright-yadda-*.tgz"

      - name: Attest SBOM
        uses: actions/attest-sbom@df501e29bc01a65642d3fb09dc8c88d6a9a7795b # v2.2.2
        with:
          subject-path: "dist-pack/playwright-yadda-*.tgz"
          sbom-path: "dist-pack/sbom.cyclonedx.json"

      - name: Publish to npm Registry with Provenance (OIDC)
        run: |
          TARBALL=$(ls dist-pack/playwright-yadda-*.tgz)
          echo "Publishing $TARBALL to registry.npmjs.org with provenance via OIDC..."
          npm publish "$TARBALL" --access public --provenance --registry https://registry.npmjs.org/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.verify.outputs.version }}"
          PREV_TAG="${{ needs.verify.outputs.previous_tag }}"

          NOTES_FLAG="--generate-notes"
          if [ -n "$PREV_TAG" ]; then
            NOTES_FLAG="--generate-notes --notes-start-tag $PREV_TAG"
          fi

          gh release create "v$VERSION" \
            dist-pack/playwright-yadda-*.tgz \
            dist-pack/sbom.cyclonedx.json \
            dist-pack/sbom.spdx.json \
            --title "v$VERSION" \
            $NOTES_FLAG
