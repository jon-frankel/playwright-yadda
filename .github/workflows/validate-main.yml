name: Validate Main

# After a merge into main: static analysis and every test suite, all in parallel. Each is a reusable
# workflow, so pr-check.yml runs the same ones for a pull request (all but latest-playwright).
#
# Run it by hand from the Actions tab with "Run workflow", which lets you pick the branch to run it
# from, for example to try a workflow change before it is merged.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every merge gets its own run, so a newer push doesn't cancel the one still validating the previous merge.
concurrency:
  group: validate-main
  cancel-in-progress: false

jobs:
  static-analysis:
    uses: ./.github/workflows/static-analysis.yml

  unit-tests:
    uses: ./.github/workflows/unit-tests.yml

  # Not in pr-check.yml: it runs the same real-Playwright tests against the newest Playwright, to notice
  # a release that changes something playwright-yadda relies on without it being documented.
  latest-playwright:
    uses: ./.github/workflows/latest-playwright.yml

  example-basic:
    uses: ./.github/workflows/example-tests.yml
    with:
      example: basic
      browsers: chromium

  example-wordpress:
    uses: ./.github/workflows/example-tests.yml
    with:
      example: wordpress
      browsers: chromium
      timeout-minutes: 20

  example-actual:
    uses: ./.github/workflows/example-tests.yml
    with:
      example: actual
      browsers: chromium
      # The first run fetches and installs Actual (a few minutes, several hundred MB); later runs restore it.
      cache-path: .cache
      cache-key-file: scripts/serve.mjs
      timeout-minutes: 40

  jetbrains-plugin:
    uses: ./.github/workflows/jetbrains-plugin-tests.yml
