<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WordPress WASM Playground</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell,
          sans-serif;
        background: #101517;
        color: #fff;
      }
      #wp-container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      #wp-frame {
        flex: 1;
        width: 100%;
        height: 100%;
        border: none;
      }
    </style>
  </head>
  <body>
    <div id="wp-container">
      <iframe
        id="wp-frame"
        name="wp-playground"
        src="https://playground.wordpress.net/?mode=seamless&login=no"
        allow="cross-origin-isolated"
      ></iframe>
    </div>
  </body>
</html>
