pluginVersion=0.2.1

# IDE the plugin is compiled and tested against. Override with -PplatformVersion=...
# or point at an installed IDE with -PlocalIdePath=/path/to/WebStorm.app (skips the download).
platformVersion=2026.2.3

# Build 262 = 2026.2. The Cucumber.js plugin internals this relies on are only verified there.
sinceBuild=262

# The IntelliJ Platform provides the Kotlin stdlib; bundling a second copy breaks plugin loading.
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
